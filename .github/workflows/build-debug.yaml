name: Build debug

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: Cache Docker image
        id: cache-docker
        uses: actions/cache@v4
        with:
          path: shijima-qt-dev.tar.gz
          key: docker-fedora-41-qt6-mingw-v6
      - name: Build Docker image
        if: steps.cache-docker.outputs.cache-hit != 'true'
        run: |
          pushd dev-docker
          docker build -t shijima-qt-dev .
          docker save shijima-qt-dev | gzip > ../shijima-qt-dev.tar.gz
          popd
      - name: Import Docker image
        if: steps.cache-docker.outputs.cache-hit == 'true'
        run: |
          gunzip -c < shijima-qt-dev.tar.gz | docker load
      - name: Build Windows x86_64 debug build
        run: |
          docker run -e CONFIG=debug --rm -v "$(pwd)":/work shijima-qt-dev bash -c \
            'mingw64-make clean && mingw64-make -j$(nproc) 2>&1 | tee build_win.log'
      - name: Print Windows build log on failure
        if: failure()
        run: |
          cat build_win.log || true
      - name: Archive Windows x86_64 debug build
        uses: actions/upload-artifact@v4
        with:
          name: debug-windows-x86_64
          path: publish/Windows/debug
          retention-days: 1


  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: Install dependencies via Homebrew
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_REQUIRE_TAP_TRUST=1 brew install qt@6 libarchive pkg-config cmake
          echo "/opt/homebrew/opt/qt@6/bin" >> $GITHUB_PATH
          echo "PKG_CONFIG_PATH=/opt/homebrew/opt/libarchive/lib/pkgconfig:/opt/homebrew/opt/qt@6/lib/pkgconfig" >> $GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=/opt/homebrew/opt/qt@6" >> $GITHUB_ENV
          echo "LDFLAGS=-L/opt/homebrew/opt/libarchive/lib -L/opt/homebrew/opt/qt@6/lib" >> $GITHUB_ENV
          echo "CPPFLAGS=-I/opt/homebrew/opt/libarchive/include -I/opt/homebrew/opt/qt@6/include" >> $GITHUB_ENV
      - name: Build macOS arm64 debug build
        env:
          CONFIG: debug
        run: |
          make clean
          make -j$(sysctl -n hw.ncpu) 2>&1 | tee build_macos.log
      - name: Print macOS build log on failure
        if: failure()
        run: |
          cat build_macos.log || true
      - name: Archive macOS arm64 debug build
        uses: actions/upload-artifact@v4
        with:
          name: debug-macos-arm64
          path: publish/macOS/debug
          retention-days: 1
