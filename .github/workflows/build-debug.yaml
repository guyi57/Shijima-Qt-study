name: Build debug

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: Fetch full history for Shijima submodules
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          git fetch --unshallow origin $BRANCH_NAME || true
          pushd libshijima
          git fetch --unshallow origin main || true
          popd
      - name: Cache Docker image
        id: cache-docker
        uses: actions/cache@v4
        with:
          path: shijima-qt-dev.tar.gz
          key: docker-fedora-41-qt6-mingw-v3
      - name: Build Docker image
        if: steps.cache-docker.outputs.cache-hit != 'true'
        run: |
          pushd dev-docker
          docker build -t shijima-qt-dev .
          docker save shijima-qt-dev | gzip > ../shijima-qt-dev.tar.gz
          popd
      - name: Import Docker image
        if: steps.cache-docker.outputs.cache-hit == 'true'
        run: |
          gunzip -c < shijima-qt-dev.tar.gz | docker load
      - name: Build Windows x86_64 debug build
        run: |
          docker run -e CONFIG=debug --rm -v "$(pwd)":/work shijima-qt-dev bash -c \
            'mingw64-make clean && mingw64-make -j$(nproc)'
      - name: Archive Windows x86_64 debug build
        uses: actions/upload-artifact@v4
        with:
          name: debug-windows-x86_64
          path: publish/Windows/debug
          retention-days: 1

  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: Fetch full history for Shijima submodules
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          git fetch --unshallow origin $BRANCH_NAME || true
          pushd libshijima
          git fetch --unshallow origin main || true
          popd
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-multimedia-dev libarchive-dev libx11-dev libsqlite3-dev libxcb-cursor0 libwayland-dev wayland-protocols pkg-config build-essential libgl1-mesa-dev libxkbcommon-dev
      - name: Build Linux debug build
        env:
          CONFIG: debug
        run: |
          make clean
          make -j$(nproc)
      - name: Archive Linux debug build
        uses: actions/upload-artifact@v4
        with:
          name: debug-linux-x86_64
          path: publish/Linux/debug
          retention-days: 1

  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: Fetch full history for Shijima submodules
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          git fetch --unshallow origin $BRANCH_NAME || true
          pushd libshijima
          git fetch --unshallow origin main || true
          popd
      - name: Install dependencies via Homebrew
        run: |
          brew install qt@6 libarchive pkg-config
      - name: Build macOS arm64 debug build
        env:
          CONFIG: debug
          PATH: /opt/homebrew/opt/qt@6/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
          PKG_CONFIG_PATH: /opt/homebrew/opt/libarchive/lib/pkgconfig:/opt/homebrew/opt/qt@6/lib/pkgconfig
          CMAKE_PREFIX_PATH: /opt/homebrew/opt/qt@6
          LDFLAGS: -L/opt/homebrew/opt/libarchive/lib -L/opt/homebrew/opt/qt@6/lib
          CPPFLAGS: -I/opt/homebrew/opt/libarchive/include -I/opt/homebrew/opt/qt@6/include
        run: |
          make clean
          make -j$(sysctl -n hw.ncpu)
      - name: Archive macOS arm64 debug build
        uses: actions/upload-artifact@v4
        with:
          name: debug-macos-arm64
          path: publish/macOS/debug
          retention-days: 1
