name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

jobs:
  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: Fetch full history for Shijima submodules
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          git fetch --unshallow origin $BRANCH_NAME || true
          pushd libshijima
          git fetch --unshallow origin main || true
          popd
      - name: Cache Docker image
        id: cache-docker
        uses: actions/cache@v4
        with:
          path: shijima-qt-dev.tar.gz
          key: docker-fedora-41-qt6-mingw-v3
      - name: Build Docker image
        if: steps.cache-docker.outputs.cache-hit != 'true'
        run: |
          pushd dev-docker
          docker build -t shijima-qt-dev .
          docker save shijima-qt-dev | gzip > ../shijima-qt-dev.tar.gz
          popd
      - name: Import Docker image
        if: steps.cache-docker.outputs.cache-hit == 'true'
        run: |
          gunzip -c < shijima-qt-dev.tar.gz | docker load
      - name: Build Windows x86_64 release build
        run: |
          docker run -e CONFIG=release --rm -v "$(pwd)":/work shijima-qt-dev bash -c \
            'mingw64-make clean && mingw64-make -j$(nproc) && cp -r licenses publish/Windows/release/'
      - name: Package Windows Zip
        run: |
          cd publish/Windows/release
          zip -r ../../../Shijima-Qt-Windows-x64.zip .
          cd ../../..
      - name: Archive Windows x86_64 release build
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x86_64
          path: Shijima-Qt-Windows-x64.zip
          retention-days: 1

  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: Fetch full history for Shijima submodules
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          git fetch --unshallow origin $BRANCH_NAME || true
          pushd libshijima
          git fetch --unshallow origin main || true
          popd
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-multimedia-dev libarchive-dev libx11-dev libsqlite3-dev libxcb-cursor0 libwayland-dev wayland-protocols pkg-config build-essential libgl1-mesa-dev libxkbcommon-dev
      - name: Build Linux release build
        env:
          CONFIG: release
        run: |
          make clean
          make -j$(nproc)
          cp -r licenses publish/Linux/release/
      - name: Package Linux Tarball
        run: |
          cd publish/Linux/release
          tar -czvf ../../../Shijima-Qt-Linux-x86_64.tar.gz .
          cd ../../..
      - name: Archive Linux release build
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-x86_64
          path: Shijima-Qt-Linux-x86_64.tar.gz
          retention-days: 1

  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: Fetch full history for Shijima submodules
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          git fetch --unshallow origin $BRANCH_NAME || true
          pushd libshijima
          git fetch --unshallow origin main || true
          popd
      - name: Install dependencies via Homebrew
        run: |
          brew install qt@6 libarchive pkg-config
      - name: Build macOS arm64 release build
        env:
          CONFIG: release
          PATH: /opt/homebrew/opt/qt@6/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
          PKG_CONFIG_PATH: /opt/homebrew/opt/libarchive/lib/pkgconfig:/opt/homebrew/opt/qt@6/lib/pkgconfig
          CMAKE_PREFIX_PATH: /opt/homebrew/opt/qt@6
          LDFLAGS: -L/opt/homebrew/opt/libarchive/lib -L/opt/homebrew/opt/qt@6/lib
          CPPFLAGS: -I/opt/homebrew/opt/libarchive/include -I/opt/homebrew/opt/qt@6/include
        run: |
          make clean
          make -j$(sysctl -n hw.ncpu)
          make macapp
          cp -r licenses publish/macOS/release/
      - name: Package macOS Zip
        run: |
          cd publish/macOS/release
          zip -r -y ../../../Shijima-Qt-macOS-AppleSilicon.zip Shijima-Qt.app
          cd ../../..
      - name: Archive macOS arm64 release build
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-arm64
          path: Shijima-Qt-macOS-AppleSilicon.zip
          retention-days: 1

  publish-release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Prepare Release Assets
        run: |
          mkdir -p final-assets
          find release-assets -type f \( -name "*.zip" -o -name "*.tar.gz" -o -name "*.AppImage" \) -exec cp {} final-assets/ \;
          ls -la final-assets/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name || 'v1.0.0' }}
          name: "Shijima-Qt Release ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name || 'v1.0.0' }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            final-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
